<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">好客山东 齐鲁风华</title>
  <desc id="desc">山东十六城文旅宣传海报，包含济南、青岛、淄博、枣庄、东营、烟台、潍坊、济宁、泰安、威海、日照、临沂、德州、聊城、滨州、菏泽的城市特色元素。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe1"/>
      <stop offset="0.42" stop-color="#dbe8dc"/>
      <stop offset="1" stop-color="#c4d9e8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9bb2"/>
      <stop offset="1" stop-color="#0e5f7a"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d5f"/>
      <stop offset="1" stop-color="#8bb16a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b77b25"/>
      <stop offset="0.5" stop-color="#f0cc76"/>
      <stop offset="1" stop-color="#a8661c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#284a4d" flood-opacity="0.18"/>
    </filter>
    <pattern id="wave" width="80" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 18 C16 2 28 2 44 18 S72 34 88 18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
    </pattern>
    <style>
      .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; }
      .sans { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .city { font: 700 34px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #223b3c; }
      .tag { font: 500 21px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #63716c; }
      .line { stroke: #c79a42; stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
      .pin { fill: #fff9eb; stroke: #d3a347; stroke-width: 4; filter: url(#softShadow); }
      .icon { fill: none; stroke: #9b2f24; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #d84f39; stroke: #9b2f24; stroke-width: 5; stroke-linejoin: round; }
      .small { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #a8661c; }
    </style>
  </defs>

