<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <title>统一审批状态机</title><desc>草稿提交后进入待审批和审批中，通过后生效，拒绝后退回草稿修改并重新提交。</desc>
  <rect width="100%" height="100%" fill="#F4F6FA"/>
  <text x="70" y="70" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#243447" text-anchor="start">统一审批状态机</text><text x="70" y="108" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6B778C" text-anchor="start">项目立项、范围发布、范围变更、结题和归档复用同一审批机制。</text><rect x="120" y="250" width="190" height="88" rx="44" fill="#FFFFFF" stroke="#243447" stroke-width="2"/><text x="215" y="304" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#243447" text-anchor="middle">草稿</text><rect x="390" y="250" width="190" height="88" rx="44" fill="#EAF4FF" stroke="#409EFF" stroke-width="2"/><text x="485" y="304" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#409EFF" text-anchor="middle">待审批</text><rect x="690" y="250" width="190" height="88" rx="44" fill="#FFF4E5" stroke="#E58A2B" stroke-width="2"/><text x="785" y="304" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#E58A2B" text-anchor="middle">审批中</text><rect x="1010" y="250" width="190" height="88" rx="44" fill="#EAF8F1" stroke="#2FA36B" stroke-width="2"/><text x="1105" y="304" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2FA36B" text-anchor="middle">已通过</text><rect x="1290" y="250" width="190" height="88" rx="44" fill="#EEF0FF" stroke="#5B5CE2" stroke-width="2"/><text x="1385" y="304" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#5B5CE2" text-anchor="middle">已生效</text><line x1="315" y1="294" x2="382" y2="294" stroke="#409EFF" stroke-width="3" /><path d="M 370 286 L 382 294 L 370 302" fill="none" stroke="#409EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="585" y1="294" x2="682" y2="294" stroke="#409EFF" stroke-width="3" /><path d="M 670 286 L 682 294 L 670 302" fill="none" stroke="#409EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="885" y1="294" x2="1002" y2="294" stroke="#409EFF" stroke-width="3" /><path d="M 990 286 L 1002 294 L 990 302" fill="none" stroke="#409EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1205" y1="294" x2="1282" y2="294" stroke="#409EFF" stroke-width="3" /><path d="M 1270 286 L 1282 294 L 1270 302" fill="none" stroke="#409EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="480" width="220" height="88" rx="44" fill="#FDEEEE" stroke="#D95050" stroke-width="2"/><text x="630" y="534" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#D95050" text-anchor="middle">已退回</text><line x1="790" y1="340" x2="700" y2="470" stroke="#D95050" stroke-width="3" /><path d="M 688 462 L 700 470 L 688 478" fill="none" stroke="#D95050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="520" y1="524" x2="320" y2="344" stroke="#D95050" stroke-width="3" /><path d="M 308 336 L 320 344 L 308 352" fill="none" stroke="#D95050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="420" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#D95050" text-anchor="middle">任一节点拒绝</text><text x="390" y="470" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#D95050" text-anchor="middle">修改后重新提交</text><rect x="80" y="680" width="1440" height="210" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="110" y="724" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#243447" text-anchor="start">审批数据要求</text><text x="120" y="770" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243447" text-anchor="start"><tspan x="120" dy="0">每次提交形成不可覆盖的版本快照，记录提交人、审批人、角色、时间、意见和前后值。</tspan><tspan x="120" dy="38">退回不删除项目、范围、材料、成果或报告；修改事实后，旧审批自动失效。</tspan><tspan x="120" dy="38">提交人与最终审批人默认不能为同一人；特殊授权必须留痕。</tspan></text>
</svg>