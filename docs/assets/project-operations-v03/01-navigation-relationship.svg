<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <title>项目区与合同区界面关系</title><desc>项目区作为独立菜单，合同区保留，二者通过项目编号和合同编号双向联动。</desc>
  <rect width="100%" height="100%" fill="#F4F6FA"/>
  <text x="80" y="70" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#243447" text-anchor="start">项目区与合同区的最终界面关系</text><text x="80" y="108" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6B778C" text-anchor="start">项目区独立进入，合同区继续负责合同事实，两区双向跳转并共享同一项目编号。</text><rect x="70" y="160" width="420" height="720" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="105" y="210" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#243447" text-anchor="start">左侧主菜单</text><rect x="100" y="250" width="360" height="208" rx="12" fill="#EAF4FF" stroke="#409EFF" stroke-width="2"/><text x="132" y="292" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#409EFF" text-anchor="start">合同管理</text><text x="148" y="334" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243447" text-anchor="start"><tspan x="148" dy="0">合同台账</tspan><tspan x="148" dy="34">合同经营看板</tspan><tspan x="148" dy="34">合同审批</tspan><tspan x="148" dy="34">合同待办</tspan></text><rect x="100" y="470" width="360" height="230" rx="12" fill="#EEF0FF" stroke="#5B5CE2" stroke-width="2"/><text x="132" y="512" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#5B5CE2" text-anchor="start">项目区</text><text x="148" y="554" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243447" text-anchor="start"><tspan x="148" dy="0">项目管理</tspan><tspan x="148" dy="34">项目立项</tspan><tspan x="148" dy="34">项目进度</tspan><tspan x="148" dy="34">项目封存</tspan><tspan x="148" dy="34">我的项目待办</tspan></text><text x="100" y="750" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#243447" text-anchor="start">项目可以先建，合同可以后挂。</text><text x="100" y="790" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#D95050" text-anchor="start">不得把项目全部塞入合同详情。</text><rect x="600" y="180" width="380" height="260" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="630" y="225" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#243447" text-anchor="start">项目详情</text><text x="630" y="272" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243447" text-anchor="start"><tspan x="630" dy="0">基本信息</tspan><tspan x="630" dy="44">办理范围与前置条件</tspan><tspan x="630" dy="44">材料和成果</tspan><tspan x="630" dy="44">结题报告与归档</tspan></text><rect x="1110" y="180" width="380" height="260" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="1140" y="225" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#243447" text-anchor="start">合同详情</text><text x="1140" y="272" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243447" text-anchor="start"><tspan x="1140" dy="0">合同原文与审批</tspan><tspan x="1140" dy="44">服务分项和金额</tspan><tspan x="1140" dy="44">补充协议和解除协议</tspan><tspan x="1140" dy="44">项目关联入口</tspan></text><line x1="980" y1="300" x2="1100" y2="300" stroke="#5B5CE2" stroke-width="3" /><path d="M 1088 292 L 1100 300 L 1088 308" fill="none" stroke="#5B5CE2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1110" y1="352" x2="990" y2="352" stroke="#409EFF" stroke-width="3" /><path d="M 978 344 L 990 352 L 978 360" fill="none" stroke="#409EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1045" y="276" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#5B5CE2" text-anchor="middle">关联合同</text><text x="1045" y="388" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#409EFF" text-anchor="middle">返回项目</text><rect x="600" y="530" width="890" height="270" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="635" y="575" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#243447" text-anchor="start">共用数据主线</text><circle cx="647" cy="614" r="9" fill="#5B5CE2"/><text x="669" y="620" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#243447" text-anchor="start">项目主数据</text><text x="669" y="650" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#6B778C" text-anchor="start">项目编号 甲方 行政区 负责人</text><circle cx="1067" cy="614" r="9" fill="#409EFF"/><text x="1089" y="620" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#243447" text-anchor="start">合同事实</text><text x="1089" y="650" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#6B778C" text-anchor="start">合同编号 金额 状态 服务分项</text><circle cx="647" cy="696" r="9" fill="#5B5CE2"/><text x="669" y="702" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#243447" text-anchor="start">办理事实</text><text x="669" y="732" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#6B778C" text-anchor="start">节点 材料 成果 前置核验</text><circle cx="1067" cy="696" r="9" fill="#409EFF"/><text x="1089" y="702" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#243447" text-anchor="start">结题事实</text><text x="1089" y="732" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#6B778C" text-anchor="start">报告 审批 归档索引</text>
</svg>
