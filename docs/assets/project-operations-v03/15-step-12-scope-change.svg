ly="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243447" text-anchor="start">项目进度</text><circle cx="42" cy="454" r="7" fill="#C5CCD6"/><text x="62" y="461" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243447" text-anchor="start">项目封存</text><text x="30" y="500" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#6B778C" text-anchor="start">说明</text><text x="42" y="542" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243447" text-anchor="start">合同区保留</text><text x="42" y="578" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#5B5CE2" text-anchor="start">项目区独立入口</text><rect x="240" y="0" width="1360" height="82" rx="0" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="276" y="52" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#243447" text-anchor="start">项目区</text><rect x="1320" y="22" width="150" height="38" rx="19" fill="#FFF4E5" stroke="none" stroke-width="1"/><text x="1395" y="49" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#E58A2B" text-anchor="middle">待业务评审</text><text x="1494" y="51" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#243447" text-anchor="start">管理员</text><text x="280" y="132" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#243447" text-anchor="start">步骤十二 发起范围变更及补充协议</text><text x="280" y="168" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B778C" text-anchor="start">项目详情  办理范围  发起变更</text><rect x="2