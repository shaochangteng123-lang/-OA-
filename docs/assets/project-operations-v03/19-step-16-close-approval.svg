6" font-weight="500" fill="#243447" text-anchor="start">合同审核</text><text x="655" y="488" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">李某</text><text x="830" y="488" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">已通过</text><rect x="305" y="518" width="610" height="66" rx="0" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="319" y="554" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#243447" text-anchor="start">财务审核</text><text x="655" y="554" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">赵某</text><text x="830" y="554" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">待处理</text><rect x="305" y="584" width="610" height="66" rx="0" fill="#F7F9FC" stroke="#DDE3EA" stroke-width="1"/><text x="319" y="620" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#243447" text-anchor="start">档案预审</text><text x="655" y="620" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">孙某</text><text x="830" y="620" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">待处理</text><text x="315" y="660" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#D95050" text-anchor="start">全部前置审核通过后，才进入总经理最终审批。</text><rect x="1000" y="205" width="565" height="665" rx="12" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="1024" y="245" font-fami