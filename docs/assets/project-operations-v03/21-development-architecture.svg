ngFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#2FA36B" text-anchor="middle">报告归档</text><rect x="95" y="905" width="190" height="38" rx="19" fill="#EAF4FF" stroke="none" stroke-width="1"/><text x="190" y="932" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#409EFF" text-anchor="middle">合同区唯一来源</text><text x="305" y="931" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#243447" text-anchor="start">合同金额、状态和协议生效事实只由合同区维护。</text><rect x="880" y="905" width="190" height="38" rx="19" fill="#EEF0FF" stroke="none" stroke-width="1"/><text x="975" y="932" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#5B5CE2" text-anchor="middle">项目区生成快照</text><text x="1090" y="931" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#243447" text-anchor="start">范围、办理、成果和报告保留版本快照。</text>
