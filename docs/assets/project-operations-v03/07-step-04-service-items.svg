447" text-anchor="middle">待合同复核</text><rect x="300" y="516" width="1210" height="62" rx="0" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="314" y="552" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#243447" text-anchor="start">施工许可证</text><text x="735" y="552" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">送电工程</text><text x="890" y="552" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">4</text><text x="1045" y="552" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">120,000</text><text x="1235" y="552" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">施工许可</text><text x="1420" y="552" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243447" text-anchor="middle">金额异常</text><text x="310" y="785" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#6B778C" text-anchor="start"><tspan x="310" dy="0">合同总额 180,000 元，当前分项合计 220,000 元，系统必须提示并阻断发布。</tspan><tspan x="310" dy="28">审批通过后不可原位覆盖，只能通过补充协议或新范围版本调整。</tspan></text><rect x="1278" y="795" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><text x="1338" y="826" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#243447" text-anchor="middle">保存草稿</text><rect x="1412" y="795" width="125" height="46" rx="8" fill="#5B5CE2" stroke="#5B5CE2" stroke-width="1"/><text x="1474.5" y="826" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size=