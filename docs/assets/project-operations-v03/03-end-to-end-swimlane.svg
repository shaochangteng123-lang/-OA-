<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>端到端项目流程</title><desc>五个阶段展示项目从甲方通知、立项、签约、办理、结题审批到归档的全过程，并标明每阶段操作角色。</desc>
  <rect width="100%" height="100%" fill="#F4F6FA"/>
  <text x="60" y="60" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#243447" text-anchor="start">项目从甲方通知到归档的端到端流程</text><text x="60" y="98" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#6B778C" text-anchor="start">五个阶段按顺序推进，每个阶段都明确操作角色、业务动作和生效条件。</text><rect x="45" y="165" width="265" height="590" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><rect x="63" y="185" width="229" height="78" rx="12" fill="#EAF8F1" stroke="#2FA36B" stroke-width="2"/><text x="177.5" y="234" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2FA36B" text-anchor="middle">阶段1  接收与立项</text><rect x="70" y="285" width="215" height="38" rx="19" fill="#F7F9FC" stroke="none" stroke-width="1"/><text x="177.5" y="312" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#243447" text-anchor="middle">甲方  项目发起人</text><circle cx="93" cy="380" r="15" fill="#2FA36B"/><text x="93" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="123" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">甲方发出项目通知</text><line x1="93" y1="398" x2="93" y2="444" stroke="#DDE3EA" stroke-width="3" /><circle cx="93" cy="462" r="15" fill="#2FA36B"/><text x="93" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="123" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">登记项目并防重</text><line x1="93" y1="480" x2="93" y2="526" stroke="#DDE3EA" stroke-width="3" /><circle cx="93" cy="544" r="15" fill="#2FA36B"/><text x="93" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="123" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">完成立项审批</text><line x1="93" y1="562" x2="93" y2="608" stroke="#DDE3EA" stroke-width="3" /><circle cx="93" cy="626" r="15" fill="#2FA36B"/><text x="93" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="123" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">发布暂定范围</text><line x1="315" y1="458" x2="340" y2="458" stroke="#99A4B3" stroke-width="3" /><path d="M 328 450 L 340 458 L 328 466" fill="none" stroke="#99A4B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="165" width="265" height="590" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><rect x="368" y="185" width="229" height="78" rx="12" fill="#EAF4FF" stroke="#409EFF" stroke-width="2"/><text x="482.5" y="234" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#409EFF" text-anchor="middle">阶段2  合同与范围</text><rect x="375" y="285" width="215" height="38" rx="19" fill="#F7F9FC" stroke="none" stroke-width="1"/><text x="482.5" y="312" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#243447" text-anchor="middle">合同经办人  项目负责人</text><circle cx="398" cy="380" r="15" fill="#409EFF"/><text x="398" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="428" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">签订合同</text><line x1="398" y1="398" x2="398" y2="444" stroke="#DDE3EA" stroke-width="3" /><circle cx="398" cy="462" r="15" fill="#409EFF"/><text x="398" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="428" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">关联既有项目</text><line x1="398" y1="480" x2="398" y2="526" stroke="#DDE3EA" stroke-width="3" /><circle cx="398" cy="544" r="15" fill="#409EFF"/><text x="398" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="428" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">确认合同服务分项</text><line x1="398" y1="562" x2="398" y2="608" stroke="#DDE3EA" stroke-width="3" /><circle cx="398" cy="626" r="15" fill="#409EFF"/><text x="398" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="428" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">发布正式范围</text><line x1="620" y1="458" x2="645" y2="458" stroke="#99A4B3" stroke-width="3" /><path d="M 633 450 L 645 458 L 633 466" fill="none" stroke="#99A4B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="655" y="165" width="265" height="590" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><rect x="673" y="185" width="229" height="78" rx="12" fill="#EEF0FF" stroke="#5B5CE2" stroke-width="2"/><text x="787.5" y="234" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#5B5CE2" text-anchor="middle">阶段3  前置与办理</text><rect x="680" y="285" width="215" height="38" rx="19" fill="#F7F9FC" stroke="none" stroke-width="1"/><text x="787.5" y="312" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#243447" text-anchor="middle">系统  项目成员</text><circle cx="703" cy="380" r="15" fill="#5B5CE2"/><text x="703" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="733" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">反向展开必要前置</text><line x1="703" y1="398" x2="703" y2="444" stroke="#DDE3EA" stroke-width="3" /><circle cx="703" cy="462" r="15" fill="#5B5CE2"/><text x="703" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="733" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">核验外部或历史成果</text><line x1="703" y1="480" x2="703" y2="526" stroke="#DDE3EA" stroke-width="3" /><circle cx="703" cy="544" r="15" fill="#5B5CE2"/><text x="703" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="733" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">分配办理任务</text><line x1="703" y1="562" x2="703" y2="608" stroke="#DDE3EA" stroke-width="3" /><circle cx="703" cy="626" r="15" fill="#5B5CE2"/><text x="703" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="733" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">材料包审核并申报</text><line x1="925" y1="458" x2="950" y2="458" stroke="#99A4B3" stroke-width="3" /><path d="M 938 450 L 950 458 L 938 466" fill="none" stroke="#99A4B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="165" width="265" height="590" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><rect x="978" y="185" width="229" height="78" rx="12" fill="#FFF4E5" stroke="#E58A2B" stroke-width="2"/><text x="1092.5" y="234" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#E58A2B" text-anchor="middle">阶段4  成果与变更</text><rect x="985" y="285" width="215" height="38" rx="19" fill="#F7F9FC" stroke="none" stroke-width="1"/><text x="1092.5" y="312" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#243447" text-anchor="middle">项目成员  项目负责人</text><circle cx="1008" cy="380" r="15" fill="#E58A2B"/><text x="1008" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1038" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">记录补正和协调</text><line x1="1008" y1="398" x2="1008" y2="444" stroke="#DDE3EA" stroke-width="3" /><circle cx="1008" cy="462" r="15" fill="#E58A2B"/><text x="1008" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1038" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">上传正式成果</text><line x1="1008" y1="480" x2="1008" y2="526" stroke="#DDE3EA" stroke-width="3" /><circle cx="1008" cy="544" r="15" fill="#E58A2B"/><text x="1008" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1038" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">核验成果并完成节点</text><line x1="1008" y1="562" x2="1008" y2="608" stroke="#DDE3EA" stroke-width="3" /><circle cx="1008" cy="626" r="15" fill="#E58A2B"/><text x="1008" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1038" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">按需发起范围变更</text><line x1="1230" y1="458" x2="1255" y2="458" stroke="#99A4B3" stroke-width="3" /><path d="M 1243 450 L 1255 458 L 1243 466" fill="none" stroke="#99A4B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1265" y="165" width="265" height="590" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><rect x="1283" y="185" width="229" height="78" rx="12" fill="#EAF8F1" stroke="#2FA36B" stroke-width="2"/><text x="1397.5" y="234" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2FA36B" text-anchor="middle">阶段5  结题与归档</text><rect x="1290" y="285" width="215" height="38" rx="19" fill="#F7F9FC" stroke="none" stroke-width="1"/><text x="1397.5" y="312" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#243447" text-anchor="middle">审核人  总经理  管理员</text><circle cx="1313" cy="380" r="15" fill="#2FA36B"/><text x="1313" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1343" y="387" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">发起结题申请</text><line x1="1313" y1="398" x2="1313" y2="444" stroke="#DDE3EA" stroke-width="3" /><circle cx="1313" cy="462" r="15" fill="#2FA36B"/><text x="1313" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1343" y="469" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">执行系统预检</text><line x1="1313" y1="480" x2="1313" y2="526" stroke="#DDE3EA" stroke-width="3" /><circle cx="1313" cy="544" r="15" fill="#2FA36B"/><text x="1313" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1343" y="551" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">并行审核和最终批准</text><line x1="1313" y1="562" x2="1313" y2="608" stroke="#DDE3EA" stroke-width="3" /><circle cx="1313" cy="626" r="15" fill="#2FA36B"/><text x="1313" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1343" y="633" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">锁定报告并归档</text><rect x="70" y="800" width="1460" height="115" rx="12" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/><rect x="95" y="825" width="170" height="38" rx="19" fill="#FFF4E5" stroke="none" stroke-width="1"/><text x="180" y="852" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#E58A2B" text-anchor="middle">合同可后签</text><text x="285" y="851" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">项目立项和签约前办理不依赖合同；合同生效后再形成正式交付范围。</text><rect x="945" y="825" width="205" height="38" rx="19" fill="#EAF4FF" stroke="none" stroke-width="1"/><text x="1047.5" y="852" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#409EFF" text-anchor="middle">前置成果可复用</text><text x="1170" y="851" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#243447" text-anchor="start">复用前必须上传或引用证据并通过核验。</text><text x="95" y="890" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#D95050" text-anchor="start">流程模板只提供完整知识，不会把所有模板节点自动生成项目待办。</text>
</svg>