# ============================================
# YuliLog 开发模式兼容入口
# ============================================
# 开发模式的唯一配置源为 docker-compose.yml。
# 保留此文件用于兼容旧命令和旧文档，避免维护两套相互偏离的开发配置。
# 新命令建议直接使用：
#   docker compose -f docker-compose.yml up -d --build
# ============================================

include:
  - path: ./docker-compose.yml
